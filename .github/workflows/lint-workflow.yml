# Could be merged back into lint.yml when hiding skipped jobs is possible https://github.com/orgs/community/discussions/18001
name: Workflow linters

on:
  # Runs when any file inside .github are changed
  push:
    branches: '**' # Don't run when pushing tags
    paths:
      - '.github/**'
  pull_request:
    paths:
      - '.github/**'

permissions: {}

concurrency:
  # Runs on any commit from upstream repo and only head commit from pull request
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: zizmor
    timeout-minutes: 5
    runs-on: ubuntu-slim
    permissions:
      contents: read # Needed by zizmor
      actions: read # Needed by zizmor
    steps:
      - name: Checkout commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          advanced-security: false
          annotations: true
          persona: pedantic
